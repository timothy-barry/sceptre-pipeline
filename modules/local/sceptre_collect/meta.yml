name: sceptre_collect
description: Validate exact proposal coverage and identities, then commit the whole family with integration and multiplicity applied once.
keywords: [sceptre, certified-execution, complete-family]
tools:
  - sceptre:
      description: Statistical analysis of single-cell CRISPR screens
      homepage: https://github.com/Katsevich-Lab/sceptre
      licence: [GPL-3]
input:
  - - meta:
        type: map
        description: Stable pipeline screen id; scientific scope belongs to the package execution certificate.
    - state:
        type: directory
        description: Certified predecessor state with a native serialized schema-7 object.
  - config:
      type: file
      description: Manifest-bound scientific configuration RDS.
      pattern: '*.rds'
  - lock:
      type: file
      description: Exact installed package, optional backend and runtime identity RDS.
      pattern: '*.rds'
  - backing:
      type: directory
      description: Count backing files for process-local reopen; no serialized live handles.
  - tools_dir:
      type: directory
      description: Staged R helpers included in task cache content identity.
  - execution:
      type: directory
      description: Frozen certified package execution plan and ordered unit scope; excludes process-local contexts, pointers and cached draws.
  - proposals:
      type: file
      description: All raw worker proposal RDS files; order is immaterial and exact certified coverage is mandatory.
      pattern: '*.rds'
  - stage:
      type: string
      description: calibration, power or discovery family.
  - seed:
      type: integer
      description: Original workflow seed checked against the serialized RNG handoff; native seed ownership remains in the package.
output:
  - state:
      - meta:
          type: map
          description: Input screen metadata retained unchanged.
      - state:
          type: directory
          description: Atomically published certified state containing the completed family only after successful collection.
  - versions:
      - versions.yml:
          type: file
          description: Installed package and execution dependency versions.
          pattern: versions.yml
authors: []
maintainers: []
